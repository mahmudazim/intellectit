<!doctype html>
<html lang="uz">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Internet yo'q · IntellectIT</title>
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 24px;
        text-align: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #fff;
        color: #1a1d23;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #0f1218; color: #e9edf3; }
        .icon { background: #1c212b; }
        .muted { color: #97a1b0; }
      }
      .icon {
        width: 56px; height: 56px;
        display: flex; align-items: center; justify-content: center;
        border-radius: 16px;
        background: #f1f3f6;
        font-size: 26px;
      }
      h1 { font-size: 18px; margin: 0; }
      p { margin: 0; font-size: 14px; max-width: 22rem; line-height: 1.5; }
      .muted { color: #5b6472; }
      button {
        margin-top: 8px;
        height: 44px;
        padding: 0 20px;
        border: 0;
        border-radius: 10px;
        background: #2563eb;
        color: #fff;
        font-size: 15px;
        font-weight: 500;
      }
    </style>
  </head>
  <body>
    <div class="icon">📡</div>
    <h1>Internet aloqasi yo'q</h1>
    <p class="muted">
      Yozgan kodingiz telefoningizda saqlangan — yo'qolmaydi. Ulanish
      qaytganda qayta yuboring.
    </p>
    <button onclick="location.reload()">Qayta urinish</button>
  </body>
</html>
